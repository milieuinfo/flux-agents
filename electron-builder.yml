appId: be.vlaanderen.flux-agents
productName: Flux Agents
copyright: Kris Speltincx

directories:
  output: release

# Wat in de app komt. .env, state, release en .git blijven er bewust uit.
files:
  - app/desktop/dist/**
  # De TUI draait vanuit bron via tsx en importeert app/desktop/shared/control.ts
  # (control-protocol). Die bron moet dus mee, niet enkel de gebundelde dist.
  - app/desktop/shared/**
  - pipeline/**
  - app/tui/**
  - tools/**
  - package.json
  - package-lock.json
  - tsconfig.json
  - tsconfig.main.json
  - tsconfig.renderer.json
  - '!**/*.map'

# electron-builder zijn eigen native rebuild overslaan. Het bundelt een oude
# node-gyp (9.x) waarvan `gyp` `distutils` importeert — verwijderd uit Python
# 3.12+, dus die rebuild faalt (en wist bovendien de werkende node-pty-build).
# `npm run app:rebuild` (electron-rebuild met node-gyp 12.x, distutils-vrij)
# bouwt node-pty al tegen Electron's ABI; electron-builder hoeft dat niet over te
# doen. Draai dus vóór `npm run app:dist` minstens één keer `npm run app:rebuild`
# (postinstall doet dit normaal automatisch).
npmRebuild: false

# Na het uitpakken (vóór signen): node-pty's `spawn-helper` weer uitvoerbaar
# maken. De npm-prebuild levert hem zonder +x; zonder die bit faalt posix_spawnp
# en blijft de TUI leeg + de knoppen dood. Zie app/desktop/after-pack.cjs.
afterPack: ./app/desktop/after-pack.cjs

asar: true
# De agent-runtime + node_modules moeten echte bestanden op schijf zijn: de
# pty-tabs draaien `node --import tsx <script>` als losse processen, en native
# node-pty kan sowieso niet vanuit een asar geladen worden.
asarUnpack:
  - pipeline/**
  - app/tui/**
  - app/desktop/shared/**
  - tools/**
  - package.json
  - package-lock.json
  - tsconfig.json
  - node_modules/**

mac:
  category: public.app-category.developer-tools
  icon: app/build/icon.icns
  # Alleen arm64 (Apple Silicon). x64 zou met npmRebuild:false een arm64
  # node-pty meekrijgen (verkeerde arch → kapotte TUI op Intel); een correcte
  # x64-build vereist een per-arch native rebuild die de gebundelde node-gyp 9.x
  # hier niet aankan. Het team draait Apple Silicon, dus arm64 volstaat.
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  # Distributie (op Kris' machine, met Apple Developer-account):
  #   - Code-signing: zet CSC_LINK + CSC_KEY_PASSWORD (Developer ID Application)
  #   - Notarization: zet APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
  #     en `notarize: true` hieronder.
  # Zonder deze env vars maakt `npm run app:dist` een ad-hoc-gesigneerde dmg die
  # lokaal werkt, maar op andere Macs een Gatekeeper-waarschuwing geeft.

dmg:
  title: ${productName}
