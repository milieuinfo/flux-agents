<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>flux-agents</title>
    <link rel="stylesheet" href="./renderer.css" />
  </head>
  <body>
    <div class="app" id="app">
      <aside class="tui-pane">
        <div class="pane-label">TUI</div>
        <div id="tui-terminal" class="terminal-host"></div>
      </aside>
      <div
        id="splitter"
        class="splitter"
        title="Versleep om te verdelen — dubbelklik om te resetten"
      ></div>
      <main class="console-pane">
        <div class="tab-strip-wrap">
          <div id="tab-strip" class="tab-strip"></div>
          <button id="tab-add" class="tab-add" title="Nieuwe shell">+</button>
          <button id="preflight-btn" class="tab-add pf-btn" title="Systeemstatus">●</button>
          <button id="settings-btn" class="tab-add" title="Instellingen">⚙</button>
        </div>
        <div id="console-body" class="terminal-host"></div>
      </main>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
