<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self';"
    />
    <title>%%APP_NAME%%</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .splash {
        box-sizing: border-box;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
        background: #1e1e1e;
        border: 1px solid #303030;
        border-radius: 12px;
        text-align: center;
        color: #eaeaea;
      }
      .splash img {
        width: 96px;
        height: 96px;
        image-rendering: -webkit-optimize-contrast;
      }
      .splash .name {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: #ffffff;
      }
      .splash .meta {
        font-size: 12px;
        color: #8a9bb0;
        line-height: 1.5;
      }
      .splash .meta b {
        color: #cccccc;
        font-weight: 600;
      }
      .splash .starting {
        margin-top: 4px;
        font-size: 12px;
        color: #6a9955;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #6a9955;
        animation: pulse 1.1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img src="./logo.png" alt="logo" />
      <div class="name">%%APP_NAME%%</div>
      <div class="meta">
        versie <b>%%VERSION%%</b><br />
        build <b>%%BUILD_DATE%%</b>
      </div>
      <div class="starting"><span class="dot"></span> Bezig met opstarten…</div>
    </div>
  </body>
</html>
